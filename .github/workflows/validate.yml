name: Validate and build Roblox place

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AETHERIA_TOOLS_DIR: ${{ runner.temp }}/aetheria-tools
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified tools
        run: python scripts/setup-tools.py
      - name: Validate and build
        run: bash scripts/check.sh
      - name: Upload Roblox place
        uses: actions/upload-artifact@v4
        with:
          name: Aetheria-place
          path: build/Aetheria.rbxlx
          if-no-files-found: error
          retention-days: 14
